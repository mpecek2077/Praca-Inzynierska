services:
  db:
    image: postgres:16-alpine
    container_name: flydes-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flydes
      POSTGRES_PASSWORD: flydes
      POSTGRES_DB: flydes
    volumes:
      - flydes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flydes -d flydes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flydes_pgdata:
